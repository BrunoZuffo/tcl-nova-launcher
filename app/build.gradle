plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.tclnova.launcher'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.tclnova.launcher'
        minSdk 28
        targetSdk 28
        versionCode 5
        versionName '0.4.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Núcleo pequeno: usado só para gerar QR Code quando solicitado.
    implementation 'com.google.zxing:core:3.5.3'
}
